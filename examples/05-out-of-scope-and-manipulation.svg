</text><text class="terminal-3954944860-r3" x="0" y="44.4" textLength="97.6" clip-path="url(#terminal-3954944860-line-1)">CaduAI:&#160;</text><text class="terminal-3954944860-r2" x="97.6" y="44.4" textLength="988.2" clip-path="url(#terminal-3954944860-line-1)">Oi!&#160;Eu&#160;sou&#160;o&#160;CaduAI,&#160;o&#160;assistente&#160;virtual&#160;da&#160;Empório&#160;da&#160;Música.&#160;Posso&#160;ajudar&#160;com&#160;</text><text class="terminal-3954944860-r2" x="1220" y="44.4" textLength="12.2" clip-path="url(#terminal-3954944860-line-1)">
</text><text class="terminal-3954944860-r2" x="0" y="68.8" textLength="939.4" clip-path="url(#terminal-3954944860-line-2)">instrumentos,&#160;preços,&#160;pedidos,&#160;trocas&#160;e&#160;políticas&#160;da&#160;loja.&#160;Como&#160;posso&#160;ajudar?</text><text class="terminal-3954944860-r2" x="1220" y="68.8" textLength="12.2" clip-path="url(#terminal-3954944860-line-2)">
