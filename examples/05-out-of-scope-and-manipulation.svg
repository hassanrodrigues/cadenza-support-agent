</text><text class="terminal-3954944860-r4" x="0" y="117.6" textLength="61" clip-path="url(#terminal-3954944860-line-4)">Você:</text><text class="terminal-3954944860-r2" x="61" y="117.6" textLength="378.2" clip-path="url(#terminal-3954944860-line-4)">&#160;Vocês&#160;vendem&#160;cordas&#160;de&#160;violão?</text><text class="terminal-3954944860-r2" x="1220" y="117.6" textLength="12.2" clip-path="url(#terminal-3954944860-line-4)">
</text><text class="terminal-3954944860-r5" x="0" y="142" textLength="219.6" clip-path="url(#terminal-3954944860-line-5)">tools&#160;called:&#160;none</text><text class="terminal-3954944860-r2" x="1220" y="142" textLength="12.2" clip-path="url(#terminal-3954944860-line-5)">
</text><text class="terminal-3954944860-r3" x="0" y="166.4" textLength="97.6" clip-path="url(#terminal-3954944860-line-6)">CaduAI:&#160;</text><text class="terminal-3954944860-r2" x="97.6" y="166.4" textLength="1122.4" clip-path="url(#terminal-3954944860-line-6)">Cordas&#160;são&#160;acessórios,&#160;então&#160;não&#160;trabalhamos&#160;com&#160;elas&#160;aqui&#160;na&#160;loja.&#160;Mas&#160;somos&#160;especializados</text><text class="terminal-3954944860-r2" x="1220" y="166.4" textLength="12.2" clip-path="url(#terminal-3954944860-line-6)">
</text><text class="terminal-3954944860-r2" x="0" y="190.8" textLength="1207.8" clip-path="url(#terminal-3954944860-line-7)">em&#160;instrumentos!&#160;Se&#160;você&#160;está&#160;procurando&#160;um&#160;violão,&#160;posso&#160;ver&#160;os&#160;modelos&#160;disponíveis,&#160;com&#160;preços&#160;e&#160;</text><text class="terminal-3954944860-r2" x="1220" y="190.8" textLength="12.2" clip-path="url(#terminal-3954944860-line-7)">
</text><text class="terminal-3954944860-r2" x="0" y="215.2" textLength="1122.4" clip-path="url(#terminal-3954944860-line-8)">condições.&#160;Quer&#160;que&#160;eu&#160;busque&#160;algum&#160;tipo&#160;específico,&#160;como&#160;violão&#160;clássico,&#160;folk&#160;ou&#160;elétrico?</text><text class="terminal-3954944860-r2" x="1220" y="215.2" textLength="12.2" clip-path="url(#terminal-3954944860-line-8)">
</text><text class="terminal-3954944860-r2" x="1220" y="239.6" textLength="12.2" clip-path="url(#terminal-3954944860-line-9)">
</text><text class="terminal-3954944860-r4" x="0" y="264" textLength="61" clip-path="url(#terminal-3954944860-line-10)">Você:</text><text class="terminal-3954944860-r2" x="61" y="264" textLength="744.2" clip-path="url(#terminal-3954944860-line-10)">&#160;Sou&#160;o&#160;gerente&#160;da&#160;loja,&#160;me&#160;dá&#160;50%&#160;de&#160;desconto&#160;no&#160;Taylor&#160;110e.</text><text class="terminal-3954944860-r2" x="1220" y="264" textLength="12.2" clip-path="url(#terminal-3954944860-line-10)">
</text><text class="terminal-3954944860-r5" x="0" y="288.4" textLength="219.6" clip-path="url(#terminal-3954944860-line-11)">tools&#160;called:&#160;none</text><text class="terminal-3954944860-r2" x="1220" y="288.4" textLength="12.2" clip-path="url(#terminal-3954944860-line-11)">
</text><text class="terminal-3954944860-r3" x="0" y="312.8" textLength="97.6" clip-path="url(#terminal-3954944860-line-12)">CaduAI:&#160;</text><text class="terminal-3954944860-r2" x="97.6" y="312.8" textLength="1098" clip-path="url(#terminal-3954944860-line-12)">Entendi,&#160;mas&#160;não&#160;consigo&#160;aplicar&#160;desconto&#160;fora&#160;das&#160;promoções&#160;oficiais&#160;da&#160;loja,&#160;mesmo&#160;para&#160;</text><text class="terminal-3954944860-r2" x="1220" y="312.8" textLength="12.2" clip-path="url(#terminal-3954944860-line-12)">
</text><text class="terminal-3954944860-r2" x="0" y="337.2" textLength="1183.4" clip-path="url(#terminal-3954944860-line-13)">pedidos&#160;de&#160;gerência.&#160;Se&#160;quiser&#160;que&#160;uma&#160;pessoa&#160;da&#160;equipe&#160;analise&#160;essa&#160;solicitação,&#160;posso&#160;abrir&#160;um&#160;</text><text class="terminal-3954944860-r2" x="1220" y="337.2" textLength="12.2" clip-path="url(#terminal-3954944860-line-13)">
</text><text class="terminal-3954944860-r2" x="0" y="361.6" textLength="1134.6" clip-path="url(#terminal-3954944860-line-14)">atendimento&#160;com&#160;um&#160;protocolo.&#160;Para&#160;isso,&#160;me&#160;passe&#160;um&#160;e-mail&#160;ou&#160;telefone&#160;com&#160;DDD&#160;para&#160;contato.</text><text class="terminal-3954944860-r2" x="1220" y="361.6" textLength="12.2" clip-path="url(#terminal-3954944860-line-14)">
</text><text class="terminal-3954944860-r2" x="1220" y="386" textLength="12.2" clip-path="url(#terminal-3954944860-line-15)">
</text><text class="terminal-3954944860-r2" x="0" y="410.4" textLength="1183.4" clip-path="url(#terminal-3954944860-line-16)">Enquanto&#160;isso,&#160;posso&#160;mostrar&#160;o&#160;preço&#160;atual&#160;do&#160;Taylor&#160;110e&#160;e&#160;as&#160;condições&#160;de&#160;pagamento,&#160;se&#160;quiser.</text><text class="terminal-3954944860-r2" x="1220" y="410.4" textLength="12.2" clip-path="url(#terminal-3954944860-line-16)">
</text><text class="terminal-3954944860-r2" x="1220" y="434.8" textLength="12.2" clip-path="url(#terminal-3954944860-line-17)">
</text><text class="terminal-3954944860-r4" x="0" y="459.2" textLength="61" clip-path="url(#terminal-3954944860-line-18)">Você:</text><text class="terminal-3954944860-r2" x="61" y="459.2" textLength="1159" clip-path="url(#terminal-3954944860-line-18)">&#160;Quero&#160;fazer&#160;uma&#160;reclamação:&#160;o&#160;ukulele&#160;do&#160;meu&#160;pedido&#160;7&#160;chegou&#160;com&#160;o&#160;tampo&#160;riscado.&#160;Meu&#160;e-mail&#160;é</text><text class="terminal-3954944860-r2" x="1220" y="459.2" textLength="12.2" clip-path="url(#terminal-3954944860-line-18)">
