    <text class="terminal-2052154841-r1" x="0" y="20" textLength="805.2" clip-path="url(#terminal-2052154841-line-0)">Digite&#160;/new&#160;para&#160;começar&#160;uma&#160;nova&#160;conversa&#160;ou&#160;/sair&#160;para&#160;encerrar.</text><text class="terminal-2052154841-r2" x="1220" y="20" textLength="12.2" clip-path="url(#terminal-2052154841-line-0)">
</text><text class="terminal-2052154841-r3" x="0" y="44.4" textLength="97.6" clip-path="url(#terminal-2052154841-line-1)">CaduAI:&#160;</text><text class="terminal-2052154841-r2" x="97.6" y="44.4" textLength="988.2" clip-path="url(#terminal-2052154841-line-1)">Oi!&#160;Eu&#160;sou&#160;o&#160;CaduAI,&#160;o&#160;assistente&#160;virtual&#160;da&#160;Empório&#160;da&#160;Música.&#160;Posso&#160;ajudar&#160;com&#160;</text><text class="terminal-2052154841-r2" x="1220" y="44.4" textLength="12.2" clip-path="url(#terminal-2052154841-line-1)">
</text><text class="terminal-2052154841-r2" x="0" y="68.8" textLength="939.4" clip-path="url(#terminal-2052154841-line-2)">instrumentos,&#160;preços,&#160;pedidos,&#160;trocas&#160;e&#160;políticas&#160;da&#160;loja.&#160;Como&#160;posso&#160;ajudar?</text><text class="terminal-2052154841-r2" x="1220" y="68.8" textLength="12.2" clip-path="url(#terminal-2052154841-line-2)">
</text><text class="terminal-2052154841-r2" x="1220" y="93.2" textLength="12.2" clip-path="url(#terminal-2052154841-line-3)">
</text><text class="terminal-2052154841-r4" x="0" y="117.6" textLength="61" clip-path="url(#terminal-2052154841-line-4)">Você:</text><text class="terminal-2052154841-r2" x="61" y="117.6" textLength="561.2" clip-path="url(#terminal-2052154841-line-4)">&#160;Me&#160;arrependi&#160;da&#160;minha&#160;compra,&#160;posso&#160;devolver?</text><text class="terminal-2052154841-r2" x="1220" y="117.6" textLength="12.2" clip-path="url(#terminal-2052154841-line-4)">
</text><text class="terminal-2052154841-r5" x="0" y="142" textLength="219.6" clip-path="url(#terminal-2052154841-line-5)">tools&#160;called:&#160;none</text><text class="terminal-2052154841-r2" x="1220" y="142" textLength="12.2" clip-path="url(#terminal-2052154841-line-5)">
</text><text class="terminal-2052154841-r3" x="0" y="166.4" textLength="97.6" clip-path="url(#terminal-2052154841-line-6)">CaduAI:&#160;</text><text class="terminal-2052154841-r2" x="97.6" y="166.4" textLength="1073.6" clip-path="url(#terminal-2052154841-line-6)">Entendo,&#160;e&#160;posso&#160;te&#160;ajudar&#160;com&#160;isso!&#160;Para&#160;verificar&#160;se&#160;o&#160;seu&#160;pedido&#160;pode&#160;ser&#160;devolvido,&#160;</text><text class="terminal-2052154841-r2" x="1220" y="166.4" textLength="12.2" clip-path="url(#terminal-2052154841-line-6)">
</text><text class="terminal-2052154841-r2" x="0" y="190.8" textLength="1220" clip-path="url(#terminal-2052154841-line-7)">preciso&#160;de&#160;um&#160;dado&#160;para&#160;localizar&#160;a&#160;compra:&#160;o&#160;e-mail&#160;ou&#160;o&#160;telefone&#160;com&#160;DDD&#160;que&#160;você&#160;usou&#160;na&#160;compra.&#160;</text><text class="terminal-2052154841-r2" x="1220" y="190.8" textLength="12.2" clip-path="url(#terminal-2052154841-line-7)">
</text><text class="terminal-2052154841-r2" x="0" y="215.2" textLength="622.2" clip-path="url(#terminal-2052154841-line-8)">Se&#160;tiver&#160;o&#160;número&#160;do&#160;pedido,&#160;pode&#160;me&#160;passar&#160;também.</text><text class="terminal-2052154841-r2" x="1220" y="215.2" textLength="12.2" clip-path="url(#terminal-2052154841-line-8)">
</text><text class="terminal-2052154841-r2" x="1220" y="239.6" textLength="12.2" clip-path="url(#terminal-2052154841-line-9)">
</text><text class="terminal-2052154841-r4" x="0" y="264" textLength="61" clip-path="url(#terminal-2052154841-line-10)">Você:</text><text class="terminal-2052154841-r2" x="61" y="264" textLength="451.4" clip-path="url(#terminal-2052154841-line-10)">&#160;Meu&#160;e-mail&#160;é&#160;leticia.rocha@jmail.com</text><text class="terminal-2052154841-r2" x="1220" y="264" textLength="12.2" clip-path="url(#terminal-2052154841-line-10)">
</text><text class="terminal-2052154841-r5" x="0" y="288.4" textLength="780.8" clip-path="url(#terminal-2052154841-line-11)">tools&#160;called:&#160;lookup_orders(contact=&quot;leticia.rocha@jmail.com&quot;),&#160;</text><text class="terminal-2052154841-r2" x="1220" y="288.4" textLength="12.2" clip-path="url(#terminal-2052154841-line-11)">
</text><text class="terminal-2052154841-r5" x="0" y="312.8" textLength="524.6" clip-path="url(#terminal-2052154841-line-12)">get_store_policy(topic=&quot;trocas_devolucoes&quot;)</text><text class="terminal-2052154841-r2" x="1220" y="312.8" textLength="12.2" clip-path="url(#terminal-2052154841-line-12)">
</text><text class="terminal-2052154841-r3" x="0" y="337.2" textLength="97.6" clip-path="url(#terminal-2052154841-line-13)">CaduAI:&#160;</text><text class="terminal-2052154841-r2" x="97.6" y="337.2" textLength="1049.2" clip-path="url(#terminal-2052154841-line-13)">Encontrei&#160;o&#160;seu&#160;pedido,&#160;o&#160;número&#160;7:&#160;1x&#160;Shelby&#160;SU-21S&#160;Soprano&#160;Sunburst,&#160;no&#160;valor&#160;de&#160;R$&#160;</text><text class="terminal-2052154841-r2" x="1220" y="337.2" textLength="12.2" clip-path="url(#terminal-2052154841-line-13)">
</text><text class="terminal-2052154841-r2" x="0" y="361.6" textLength="488" clip-path="url(#terminal-2052154841-line-14)">159,90,&#160;entregue&#160;e&#160;pago&#160;no&#160;cartão&#160;em&#160;3x.</text><text class="terminal-2052154841-r2" x="1220" y="361.6" textLength="12.2" clip-path="url(#terminal-2052154841-line-14)">
</text><text class="terminal-2052154841-r2" x="1220" y="386" textLength="12.2" clip-path="url(#terminal-2052154841-line-15)">
</text><text class="terminal-2052154841-r2" x="0" y="410.4" textLength="1195.6" clip-path="url(#terminal-2052154841-line-16)">Ele&#160;está&#160;elegível&#160;para&#160;devolução&#160;por&#160;arrependimento&#160;até&#160;*24/02/2026*.&#160;Algumas&#160;condições&#160;para&#160;isso:</text><text class="terminal-2052154841-r2" x="1220" y="410.4" textLength="12.2" clip-path="url(#terminal-2052154841-line-16)">
</text><text class="terminal-2052154841-r2" x="1220" y="434.8" textLength="12.2" clip-path="url(#terminal-2052154841-line-17)">
</text><text class="terminal-2052154841-r2" x="0" y="459.2" textLength="1195.6" clip-path="url(#terminal-2052154841-line-18)">-&#160;O&#160;instrumento&#160;precisa&#160;estar&#160;na&#160;embalagem&#160;original,&#160;sem&#160;sinais&#160;de&#160;uso,&#160;com&#160;todos&#160;os&#160;acessórios&#160;e&#160;</text><text class="terminal-2052154841-r2" x="1220" y="459.2" textLength="12.2" clip-path="url(#terminal-2052154841-line-18)">
</text><text class="terminal-2052154841-r2" x="0" y="483.6" textLength="97.6" clip-path="url(#terminal-2052154841-line-19)">manuais.</text><text class="terminal-2052154841-r2" x="1220" y="483.6" textLength="12.2" clip-path="url(#terminal-2052154841-line-19)">
</text><text class="terminal-2052154841-r2" x="0" y="508" textLength="878.4" clip-path="url(#terminal-2052154841-line-20)">-&#160;O&#160;reembolso&#160;é&#160;feito&#160;na&#160;mesma&#160;forma&#160;de&#160;pagamento,&#160;em&#160;até&#160;10&#160;dias&#160;úteis.</text><text class="terminal-2052154841-r2" x="1220" y="508" textLength="12.2" clip-path="url(#terminal-2052154841-line-20)">
</text><text class="terminal-2052154841-r2" x="0" y="532.4" textLength="890.6" clip-path="url(#terminal-2052154841-line-21)">-&#160;Em&#160;caso&#160;de&#160;arrependimento,&#160;o&#160;frete&#160;da&#160;devolução&#160;fica&#160;por&#160;conta&#160;da&#160;loja.</text><text class="terminal-2052154841-r2" x="1220" y="532.4" textLength="12.2" clip-path="url(#terminal-2052154841-line-21)">
</text><text class="terminal-2052154841-r2" x="1220" y="556.8" textLength="12.2" clip-path="url(#terminal-2052154841-line-22)">
</text><text class="terminal-2052154841-r2" x="0" y="581.2" textLength="1171.2" clip-path="url(#terminal-2052154841-line-23)">Você&#160;quer&#160;seguir&#160;com&#160;a&#160;devolução?&#160;Se&#160;quiser,&#160;posso&#160;abrir&#160;um&#160;chamado&#160;para&#160;a&#160;equipe&#160;dar&#160;andamento.</text><text class="terminal-2052154841-r2" x="1220" y="581.2" textLength="12.2" clip-path="url(#terminal-2052154841-line-23)">
</text><text class="terminal-2052154841-r2" x="1220" y="605.6" textLength="12.2" clip-path="url(#terminal-2052154841-line-24)">
