[project]
name = "cadenza"
version = "0.1.0"
description = "Customer support agent for Empório da Música, a fictional music store."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3",
    "langchain-anthropic>=1.6",
    "langgraph>=1.2",
    "pandas>=2.2",
    "pypdf>=6.0",
    "python-dotenv>=1.2",
    "rapidfuzz>=3.9",
    "rich>=14.0",
    "tzdata>=2025.2",
]

[project.scripts]
cadenza = "cadenza.cli:main"

[project.optional-dependencies]
# Other providers through the same MODEL=provider/model switch; only Anthropic is tested.
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
groq = ["langchain-groq"]
openrouter = ["langchain-openrouter"]
aws = ["langchain-aws"]
ollama = ["langchain-ollama"]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.16"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cadenza"]
package-dir = { "" = "src" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
